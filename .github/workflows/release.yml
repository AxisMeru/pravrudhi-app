name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: install dependencies
        working-directory: frontend
        run: npm ci

      - name: build static export
        working-directory: frontend
        run: npm run build

      - name: upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          if-no-files-found: error

  desktop:
    needs: [frontend]
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, mac, win]
        include:
          - { platform: linux, os: ubuntu-latest }
          - { platform: mac, os: macos-latest }
          - { platform: win, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: download frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-out
          path: frontend/out

      # editions/product.json ships committed with no Supabase fields (docs/decisions/reports/
      # 2026-09-12-w3-desktop-signin-coverage.md §2: nothing credential-shaped is ever committed), so a build
      # that runs without these repository variables set keeps today's safe default — "not configured" — rather
      # than failing. SUPABASE_ANON_KEY is the client-side anon key, meant to be public and safe in a shipped
      # bundle; it is a repository *variable*, not a secret, for that reason. Passed through env rather than
      # interpolated into the shell script, so neither value ever passes through shell parsing.
      - name: write real Supabase configuration into edition.json, when this repository has any configured
        if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_ANON_KEY != '' }}
        working-directory: desktop
        shell: bash
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          node -e "require('node:fs').writeFileSync('editions/product.json', JSON.stringify({edition:'product',supabaseUrl:process.env.SUPABASE_URL,supabaseAnonKey:process.env.SUPABASE_ANON_KEY}))"

      - name: build desktop for ${{ matrix.platform }}
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --${{ matrix.platform }} --config electron-builder.json

      - name: verify package.json was not rewritten
        working-directory: desktop
        run: node -e "const p=require('./package.json'); if(!p.scripts||!p.main) { throw new Error('build clobbered package.json'); }"

      - name: upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          path: |
            desktop/dist/product/*.AppImage
            desktop/dist/product/*.dmg
            desktop/dist/product/*.exe
            desktop/dist/product/*.zip
          if-no-files-found: error

  # The packaged product, smoked as a user would run it: the AppImage under Xvfb, finding the engine this
  # repository pins (scripts/install-engine.sh installs the wheels from AxisMeru/pravrudhi's release). Reports beside
  # the release waits for it: the same shell code passed this smoke on AxisMeru/pravrudhi's v0.5.5 for both
  # editions, and a first product release that fails loudly beats one that ships an installer nobody launched.
  packaged-smoke:
    needs: [desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: astral-sh/setup-uv@v6
        with: { python-version: "3.13" }
      - name: install the pinned engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRAVRUDHI_APP_HOME="$GITHUB_WORKSPACE/.pravrudhi-app" bash scripts/install-engine.sh
          "$GITHUB_WORKSPACE/.pravrudhi-app/engine/.venv/bin/pravrudhi" --version
      - uses: actions/download-artifact@v4
        with:
          name: installers-linux
          # smoke-dist.js reads dist/<edition>/ and this repository builds one edition, the product.
          path: desktop/dist/product
      - name: smoke the packaged AppImage against the pinned engine
        working-directory: desktop
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2 > /dev/null
          npm ci
          export PATH="$GITHUB_WORKSPACE/.pravrudhi-app/engine/.venv/bin:$PATH"
          ls dist/product
          npm run smoke:dist -- product
          cat .smoke-dist/.smoke/report.json

  release:
    needs: [desktop, packaged-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      - name: compute checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
