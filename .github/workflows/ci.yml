name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: guard tests
        run: node --test scripts/test/*.test.mjs
      - name: no recorded-looking ids, emails or home paths in fixtures and e2e specs
        run: node scripts/check-no-private-data.mjs
      # #101: no real name and no real case or crime number, email, mobile, PAN or Aadhaar-like number anywhere in the repository (every tracked text file).
      # The shape patterns ALWAYS run. The real names are NEVER in the repo: the private list is the INVENTED_FIXTURE_NAMES secret.
      #  - Pull requests from FORKS never get secrets: the name check is skipped with a warning, the shapes still run (--names-optional).
      #  - The main repo: with REQUIRE_NAMES_ON_MAIN "true" the name check is REQUIRED (--require-names): a missing, blank or name-less secret FAILS the job.
      #    With it "false" (the default NOW; temporary, Lead-2, 12 Oct, until the secret exists) a non-blank secret is still used and required, and a blank
      #    one only warns, with a ::warning:: on EVERY main run that skips, so the gap is visible in each log. Until the flip, the real-name check does NOT
      #    run on the main repo unless the secret exists. Project #1 item: pravrudhi-app #102 "Create the INVENTED_FIXTURE_NAMES repo secret and flip
      #    REQUIRE_NAMES_ON_MAIN to true" (owner Lead-2, due Fri 16 Oct). The flip is the one line below: REQUIRE_NAMES_ON_MAIN: "true".
      #  - Fork pull requests stay --names-optional whatever the switch says (a fork cannot read the secret).
      # The secret may be multi-line and Actions does not mask it per line: it is never echoed, the file is mode 600 and removed on exit.
      - name: invented fixtures only (no real name, case or crime number, no personal data)
        env:
          REQUIRE_NAMES_ON_MAIN: "false"
          IS_FORK_PR: ${{ github.event.pull_request.head.repo.fork }}
          INVENTED_FIXTURE_NAMES: ${{ secrets.INVENTED_FIXTURE_NAMES }}
        run: |
          set +x
          umask 077
          names="$RUNNER_TEMP/invented-names.txt"
          trap 'rm -f "$names"' EXIT
          have_secret=false
          if [ -n "$(printf '%s' "$INVENTED_FIXTURE_NAMES" | tr -d '[:space:]')" ]; then have_secret=true; fi
          if [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::fork pull request: no secrets, the real-name check is SKIPPED, shape patterns still run"
            node scripts/check-invented-fixtures.mjs --names-optional
          elif [ "$REQUIRE_NAMES_ON_MAIN" = "true" ] || [ "$have_secret" = "true" ]; then
            printf '%s' "$INVENTED_FIXTURE_NAMES" > "$names"
            INVENTED_FIXTURE_NAMES_FILE="$names" node scripts/check-invented-fixtures.mjs --require-names
          else
            echo "::warning::INVENTED_FIXTURE_NAMES is not set (main-repo skip is temporary, Lead-2, 12 Oct): the real-name check is SKIPPED, shape patterns still run"
            node scripts/check-invented-fixtures.mjs --names-optional
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: frontend dependencies
        working-directory: frontend
        run: npm ci

      # The benchmark results page's data gate (#638): the vendored validator (scripts/benchmarks/, VENDORED.txt) exits non-zero on an
      # unreviewed number, a banned word or a result sentence the templates would not produce, and the build fails with it.
      - name: benchmark results data gate
        run: |
          python3 scripts/benchmarks/validate_page_data.py frontend/public/benchmark_results.json
          (cd scripts/benchmarks && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest)

      - name: typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p .

      - name: lint
        working-directory: frontend
        run: npx eslint . --max-warnings=0

      - name: tests
        working-directory: frontend
        run: npm test

      - name: build
        working-directory: frontend
        run: npm run build

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: desktop tests
        working-directory: desktop
        run: node --test test/

  # The interface on a real product engine: the pinned release wheels (engine/ENGINE_VERSION) serve this
  # repository's built pages through PRAVRUDHI_FRONTEND_DIR, from a root `pravrudhi init` made a moment ago,
  # exactly as the desktop shell arranges it on a user's machine.
  # app#1055: the library reference (TypeDoc) must build. Build-only: the output (docs/reference) is not committed; the HTML is kept as a run artifact.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: build the library reference
        working-directory: frontend
        run: npm run docs
      - name: keep the reference
        uses: actions/upload-artifact@v4
        with:
          name: library-reference
          path: docs/reference
          retention-days: 7

  e2e-shard:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: build the interface
        working-directory: frontend
        # The sign-in page renders its form only when a Supabase project is named at build time; these are public,
        # inert placeholders so the guards have a form to check (nothing is called until submit).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

      - name: cache the pinned engine release
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/app-home
          key: engine-${{ runner.os }}-py3.13-${{ hashFiles('engine/ENGINE_VERSION') }}

      - name: install the pinned engine release
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PRAVRUDHI_APP_HOME="$RUNNER_TEMP/app-home" ./scripts/install-engine.sh

      - name: browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: serve the built pages from a product engine and run the suite
        working-directory: frontend
        env:
          PRAVRUDHI_EDITION: product
        run: |
          ENGINE="$RUNNER_TEMP/app-home/engine/.venv/bin/pravrudhi"
          ROOT="$RUNNER_TEMP/root"; mkdir -p "$ROOT"
          "$ENGINE" init --root "$ROOT"
          PRAVRUDHI_FRONTEND_DIR="$PWD/out" "$ENGINE" app --root "$ROOT" --no-browser --port 8301 --host 127.0.0.1 > "$RUNNER_TEMP/engine.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8301/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8301/api/me
          # A second engine as the Studio edition (loopback only, no credentials) for the specs that drive the
          # improvement loop's pages, which are closed to a member on the product edition (#525).
          STUDIO_ROOT="$RUNNER_TEMP/studio-root"; mkdir -p "$STUDIO_ROOT"
          "$ENGINE" init --root "$STUDIO_ROOT"
          PRAVRUDHI_EDITION=studio PRAVRUDHI_STUDIO_LOOPBACK_ONLY=1 PRAVRUDHI_FRONTEND_DIR="$PWD/out" "$ENGINE" app --root "$STUDIO_ROOT" --no-browser --port 8302 --host 127.0.0.1 > "$RUNNER_TEMP/engine-studio.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8302/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8302/api/me
          LOCAL_ENGINE_URL=http://127.0.0.1:8301 STUDIO_ENGINE_URL=http://127.0.0.1:8302 npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob

      - name: keep this shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blobplain-${{ matrix.shard }}
          path: frontend/blob-report
          retention-days: 3
          if-no-files-found: error

      - name: engine log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/engine.log" "$RUNNER_TEMP/engine-studio.log" || true

  # The check named `e2e` is now the AGGREGATE of the three shards above (same name as before, so the branch rules and the merge guard read it unchanged): it fails unless every shard passed, and it merges
  # the shard reports into one so the run shows the whole suite.
  e2e:
    runs-on: ubuntu-latest
    needs: e2e-shard
    if: always()
    steps:
      - name: every shard passed
        run: |
          test "${{ needs.e2e-shard.result }}" = "success" || { echo "e2e shards: ${{ needs.e2e-shard.result }}"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: frontend dependencies
        working-directory: frontend
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blobplain-*
          path: frontend/all-blob-reports
          merge-multiple: true
      - name: merged report
        working-directory: frontend
        run: npx playwright merge-reports --reporter=line ./all-blob-reports

  # The SHIPPED configuration (Lead-2, 14 Oct): the same suite, built with the flags the production deploy carries, so the flag-gated specs (assistant entry and run, Run again, the
  # assistant provider read, the running view, the memo steps, the intake page) RUN instead of skipping. The env names are exactly the ones Track A's pre-deploy run uses:
  # NEXT_PUBLIC_ASSISTANT_ENTRY=1, NEXT_PUBLIC_ASSISTANT_DELETE_CONFIRMED=1, NEXT_PUBLIC_INTAKE=1 at build time, and INTAKE_BUILD=1 for the intake specs. The default `e2e` job above stays
  # as is (flags off), so its check name is unchanged. Citations are NOT in this entry: they are added only if production turns citations on.
  e2e-shipped-shard:
    runs-on: ubuntu-latest
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The production flags, written ONCE here for the build and the test step (the specs read them to decide whether to skip).
    env:
      NEXT_PUBLIC_ASSISTANT_ENTRY: "1"
      NEXT_PUBLIC_ASSISTANT_DELETE_CONFIRMED: "1"
      NEXT_PUBLIC_INTAKE: "1"
      INTAKE_BUILD: "1"
      NEXT_PUBLIC_YOUR_MATTERS: "1"
      YOUR_MATTERS_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: build the interface (shipped flags)
        working-directory: frontend
        # The sign-in page renders its form only when a Supabase project is named at build time; these are public,
        # inert placeholders so the guards have a form to check (nothing is called until submit).
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build

      - name: cache the pinned engine release
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/app-home
          key: engine-${{ runner.os }}-py3.13-${{ hashFiles('engine/ENGINE_VERSION') }}

      - name: install the pinned engine release
        if: steps.engine-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: PRAVRUDHI_APP_HOME="$RUNNER_TEMP/app-home" ./scripts/install-engine.sh

      - name: browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: serve the built pages from a product engine and run the suite
        working-directory: frontend
        env:
          PRAVRUDHI_EDITION: product
        run: |
          ENGINE="$RUNNER_TEMP/app-home/engine/.venv/bin/pravrudhi"
          ROOT="$RUNNER_TEMP/root"; mkdir -p "$ROOT"
          "$ENGINE" init --root "$ROOT"
          PRAVRUDHI_FRONTEND_DIR="$PWD/out" "$ENGINE" app --root "$ROOT" --no-browser --port 8301 --host 127.0.0.1 > "$RUNNER_TEMP/engine.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8301/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8301/api/me
          # A second engine as the Studio edition (loopback only, no credentials) for the specs that drive the
          # improvement loop's pages, which are closed to a member on the product edition (#525).
          STUDIO_ROOT="$RUNNER_TEMP/studio-root"; mkdir -p "$STUDIO_ROOT"
          "$ENGINE" init --root "$STUDIO_ROOT"
          PRAVRUDHI_EDITION=studio PRAVRUDHI_STUDIO_LOOPBACK_ONLY=1 PRAVRUDHI_FRONTEND_DIR="$PWD/out" "$ENGINE" app --root "$STUDIO_ROOT" --no-browser --port 8302 --host 127.0.0.1 > "$RUNNER_TEMP/engine-studio.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8302/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8302/api/me
          LOCAL_ENGINE_URL=http://127.0.0.1:8301 STUDIO_ENGINE_URL=http://127.0.0.1:8302 npx playwright test --shard=${{ matrix.shard }}/3 --reporter=blob

      - name: keep this shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blobshipped-${{ matrix.shard }}
          path: frontend/blob-report
          retention-days: 3
          if-no-files-found: error

      - name: engine log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/engine.log" "$RUNNER_TEMP/engine-studio.log" || true

  # The check named `e2e-shipped` is the AGGREGATE of the shards above (same name as before): every shard must pass, the reports are merged into ONE JSON report, and the flag-gated-specs-ran check
  # reads that merged report (a single shard holds only part of the suite, so the check cannot run per shard).
  e2e-shipped:
    runs-on: ubuntu-latest
    needs: e2e-shipped-shard
    if: always()
    steps:
      - name: every shard passed
        run: |
          test "${{ needs.e2e-shipped-shard.result }}" = "success" || { echo "e2e-shipped shards: ${{ needs.e2e-shipped-shard.result }}"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: frontend dependencies
        working-directory: frontend
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blobshipped-*
          path: frontend/all-blob-reports
          merge-multiple: true
      - name: merged JSON report
        working-directory: frontend
        run: PLAYWRIGHT_JSON_OUTPUT_NAME="$RUNNER_TEMP/pw-report.json" npx playwright merge-reports --reporter=json ./all-blob-reports

      # A Playwright run exits 0 when specs SKIP: if the flags stopped reaching the test process, the flag-gated specs would skip and this job would stay green. Fail unless each required spec file ran
      # (assistant-run, intake and anonymous-assistant: no skips; assistant-tier skips one test on purpose in a flags-ON build, so it needs passes only). Same groups as the pre-deploy gate.
      - name: the flag-gated specs ran (not skipped)
        run: node scripts/check-flag-specs-ran.mjs "$RUNNER_TEMP/pw-report.json"
